[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-quest"
version = "0.1.0"
description = "機械学習をもとにした課題解決のために, 問題を設定するライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml"
]

[project.optional-dependencies]
# 手元のデータから答えの候補を出す (ML-EDA の読み込みと分析. 画像と, WAVE
# の他の音声も読む)
data = [
    "ml-eda[image,audio] @ git+https://github.com/victor-von-pooh/ML-EDA.git@2a7782f"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
