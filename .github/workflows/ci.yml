name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 任意の依存を入れない場合と, データの候補 (ML-EDA) を入れた場合
          - python-version: "3.10"
            extras: dev
          - python-version: "3.13"
            extras: dev,data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q
      # 1 行 79 文字以内 (CODING_STYLE.md. 日本語も 1 文字と数える)
      - name: 行の長さの確認
        run: |
          python - <<'PY'
          import pathlib
          import sys

          long = [
              f"{path}:{number}"
              for path in sorted(pathlib.Path(".").glob("[st]*/**/*.py"))
              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), 1
              )
              if len(line) > 79
          ]
          print("\n".join(long))
          sys.exit(1 if long else 0)
          PY

  # 書き出した骨組みを学習と推論の一式まで通すテスト (CPU の PyTorch と,
  # 骨組みが使う段階のライブラリの main). 上のジョブではこれらを入れないので
  # 飛ばされる. 飛ばしたテストがあれば誤りにする
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ML-Inference の依存の ML-EDA は版を固定しない git の main で, data の
      # 固定と同じ名前を 2 つの場所から入れられないので, 依存は入れずに入れる
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]" pyarrow \
            "ml-found @ git+https://github.com/victor-von-pooh/ML-Found.git" \
            "ml-modelcontrol @ git+https://github.com/victor-von-pooh/ML-ModelControl.git"
          pip install --no-deps \
            "ml-inference @ git+https://github.com/victor-von-pooh/ML-Inference.git"
      # pipefail で pytest の誤りを止める
      - shell: bash
        run: pytest -q -rs | tee pytest.log
      - name: 飛ばしたテストが無いことの確認
        run: |
          if grep -q "^SKIPPED" pytest.log; then
            echo "飛ばしたテストがあります"
            exit 1
          fi
